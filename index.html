<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <title>The Weather Chaser</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="weather-app">
        <header>
          <form class="search-form" id="search-form">
            <input
              type="search"
              placeholder="Enter a city"
              required
              id="search-form-input"
              class="search-form-input"
            />
            <input type="submit" value="Search" class="search-button" />
          </form>
        </header>
        <main>
          <div class="weather-app-data">
            <div>
              <h1 class="weather-app-city" id="weather-app-city"></h1>
              <p class="weather-app-details">
                <span id="weather-app-time"></span>,
                <span id="weather-app-description"> Sunshine</span>
                <br />
                Humidity: <strong id="weather-app-humidity"> </strong>, Wind:
                <strong id="weather-app-windspeed"> </strong>
              </p>
            </div>
            <div class="weather-app-temperature-container">
              <div id="weather-app-emoji"></div>
              <div
                class="weather-app-temperature"
                id="weather-app-temperature"
              ></div>
              <div
                class="weather-app-temperature-unit"
                id="weather-app-temperature-unit"
              >
                °C
              </div>
            </div>
          </div>
          <div class="weather-forecast" id="forecast"></div>
        </main>
        <footer>
          Coded by
          <a href="https://github.com/AmandaMareeJones" target="_blank"
            >Amanda Jones</a
          >, open-sourced on
          <a
            href="https://github.com/AmandaMareeJones/The-Weather-Chaser"
            target="_blank"
            >GitHub</a
          >
          and hosted on
          <a href="https://theweatherchaser.netlify.app/" target="_blank"
            >Netlify</a
          >
        </footer>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
